<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Llama - Assistir Juntos</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #121212;
            color: #e0e0e0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        header {
            background-color: #1e1e1e;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #2c2c2c;
        }

        header h1 {
            font-size: 1.2rem;
            color: #ffffff;
            letter-spacing: 0.5px;
        }

        .container {
            display: flex;
            flex-direction: column;
            flex: 1;
            overflow: hidden;
        }

        @media (min-width: 768px) {
            .container {
                flex-direction: row;
            }
        }

        .player-section {
            flex: 2;
            background-color: #000000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 10px;
        }

        video {
            width: 100%;
            max-height: 70vh;
            background-color: #000;
            outline: none;
        }

        .url-box {
            width: 100%;
            padding: 10px;
            background-color: #1e1e1e;
            display: flex;
            gap: 8px;
        }

        .url-box input {
            flex: 1;
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid #333;
            background-color: #2c2c2c;
            color: #fff;
            font-size: 0.9rem;
        }

        .url-box button {
            padding: 8px 16px;
            border-radius: 6px;
            border: none;
            background-color: #e50914;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        .chat-section {
            flex: 1;
            background-color: #181818;
            display: flex;
            flex-direction: column;
            border-left: 1px solid #2c2c2c;
            max-height: 40vh;
        }

        @media (min-width: 768px) {
            .chat-section {
                max-height: none;
                width: 350px;
            }
        }

        .chat-messages {
            flex: 1;
            padding: 12px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .message {
            max-width: 80%;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 0.9rem;
            line-height: 1.4;
            word-wrap: break-word;
        }

        .message.received {
            background-color: #2a2a2a;
            color: #f1f1f1;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
        }

        .message.sent {
            background-color: #e50914;
            color: #ffffff;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }

        .chat-input-box {
            padding: 10px;
            background-color: #1e1e1e;
            display: flex;
            gap: 8px;
            border-top: 1px solid #2c2c2c;
        }

        .chat-input-box input {
            flex: 1;
            padding: 10px 14px;
            border-radius: 20px;
            border: 1px solid #333;
            background-color: #2c2c2c;
            color: #fff;
            font-size: 0.9rem;
            outline: none;
        }

        .chat-input-box button {
            padding: 0 16px;
            border-radius: 20px;
            border: none;
            background-color: #e50914;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <header>
        <h1>🦙 Llama</h1>
    </header>

    <div class="container">
        <div class="player-section">
            <video id="videoPlayer" controls crossorigin="anonymous"></video>
            <div class="url-box">
                <input type="text" id="videoUrlInput" placeholder="Cole o link direto do vídeo (.mp4)...">
                <button id="loadVideoBtn">Carregar</button>
            </div>
        </div>

        <div class="chat-section">
            <div class="chat-messages" id="chatMessages"></div>
            <div class="chat-input-box">
                <input type="text" id="chatInput" placeholder="Digite sua mensagem...">
                <button id="sendBtn">Enviar</button>
            </div>
        </div>
    </div>

    <!-- Socket.io injetado automaticamente pelo servidor Node.js -->
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();

        const videoPlayer = document.getElementById('videoPlayer');
        const videoUrlInput = document.getElementById('videoUrlInput');
        const loadVideoBtn = document.getElementById('loadVideoBtn');
        const chatMessages = document.getElementById('chatMessages');
        const chatInput = document.getElementById('chatInput');
        const sendBtn = document.getElementById('sendBtn');

        let isRemoteAction = false;

        // Carregar novo vídeo via URL
        loadVideoBtn.addEventListener('click', () => {
            const url = videoUrlInput.value.trim();
            if (url) {
                videoPlayer.src = url;
                socket.emit('mudar video', url);
            }
        });

        socket.on('mudar video', (url) => {
            isRemoteAction = true;
            videoPlayer.src = url;
            videoUrlInput.value = url;
        });

        // Sincronização de Play/Pause/Seek
        videoPlayer.addEventListener('play', () => {
            if (isRemoteAction) { isRemoteAction = false; return; }
            socket.emit('play', { currentTime: videoPlayer.currentTime });
        });

        videoPlayer.addEventListener('pause', () => {
            if (isRemoteAction) { isRemoteAction = false; return; }
            socket.emit('pause', { currentTime: videoPlayer.currentTime });
        });

        videoPlayer.addEventListener('seeked', () => {
            if (isRemoteAction) { isRemoteAction = false; return; }
            socket.emit('seek', { currentTime: videoPlayer.currentTime });
        });

        socket.on('play', (data) => {
            isRemoteAction = true;
            videoPlayer.currentTime = data.currentTime;
            videoPlayer.play();
        });

        socket.on('pause', (data) => {
            isRemoteAction = true;
            videoPlayer.currentTime = data.currentTime;
            videoPlayer.pause();
        });

        socket.on('seek', (data) => {
            isRemoteAction = true;
            videoPlayer.currentTime = data.currentTime;
        });

        // Lógica do Chat
        function appendMessage(text, type) {
            const div = document.createElement('div');
            div.className = `message ${type}`;
            div.textContent = text;
            chatMessages.appendChild(div);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function sendMessage() {
            const text = chatInput.value.trim();
            if (text) {
                appendMessage(text, 'sent');
                socket.emit('chat message', text);
                chatInput.value = '';
            }
        }

        sendBtn.addEventListener('click', sendMessage);
        chatInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        socket.on('chat message', (msg) => {
            appendMessage(msg, 'received');
        });
    </script>
</body>
</html>
