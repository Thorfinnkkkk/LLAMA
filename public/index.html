<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Llama - Assistir Juntos</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #121212;
            color: #e0e0e0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        header {
            background-color: #1a1a1a;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #2c2c2c;
        }

        header h1 {
            font-size: 1.2rem;
            color: #ffffff;
            letter-spacing: 0.5px;
        }

        .container {
            display: flex;
            flex-direction: column;
            flex: 1;
            overflow: hidden;
        }

        .player-section {
            flex: 1;
            background-color: #000000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            min-height: 220px;
        }

        video {
            width: 100%;
            height: 100%;
            max-height: 40vh;
            object-fit: contain;
        }

        .controls-bar {
            padding: 10px;
            background-color: #1a1a1a;
            width: 100%;
            display: flex;
            gap: 8px;
        }

        .controls-bar input {
            flex: 1;
            padding: 8px 12px;
            background-color: #2c2c2c;
            border: 1px solid #3c3c3c;
            border-radius: 4px;
            color: #fff;
            font-size: 0.9rem;
        }

        .controls-bar button {
            padding: 8px 16px;
            background-color: #e50914;
            color: white;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
        }

        .chat-section {
            height: 35vh;
            background-color: #181818;
            display: flex;
            flex-direction: column;
            border-top: 1px solid #2c2c2c;
        }

        .chat-messages {
            flex: 1;
            padding: 10px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .message {
            background-color: #252525;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.9rem;
            max-width: 85%;
            word-break: break-word;
        }

        .chat-input-bar {
            padding: 10px;
            background-color: #1e1e1e;
            display: flex;
            gap: 8px;
            border-top: 1px solid #2c2c2c;
        }

        .chat-input-bar input {
            flex: 1;
            padding: 8px 12px;
            background-color: #2c2c2c;
            border: 1px solid #3c3c3c;
            border-radius: 4px;
            color: #fff;
        }

        .chat-input-bar button {
            padding: 8px 16px;
            background-color: #3b82f6;
            color: white;
            border: none;
            border-radius: 4px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <header>
        <h1>🦙 Llama</h1>
    </header>

    <div class="container">
        <!-- Secção do Vídeo -->
        <div class="player-section">
            <video id="videoPlayer" controls crossorigin="anonymous"></video>
        </div>

        <div class="controls-bar">
            <input type="text" id="videoUrlInput" placeholder="Cole o link direto do vídeo (.mp4)...">
            <button id="loadVideoBtn">Carregar</button>
        </div>

        <!-- Secção do Chat -->
        <div class="chat-section">
            <div class="chat-messages" id="chatMessages">
                <div class="message"><b>Sistema:</b> Bem-vindo ao Llama! Partilhe o link com a sua namorada.</div>
            </div>
            <div class="chat-input-bar">
                <input type="text" id="chatInput" placeholder="Escreva uma mensagem...">
                <button id="sendChatBtn">Enviar</button>
            </div>
        </div>
    </div>

    <!-- Socket.io do Servidor -->
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();

        const videoPlayer = document.getElementById('videoPlayer');
        const videoUrlInput = document.getElementById('videoUrlInput');
        const loadVideoBtn = document.getElementById('loadVideoBtn');
        const chatMessages = document.getElementById('chatMessages');
        const chatInput = document.getElementById('chatInput');
        const sendChatBtn = document.getElementById('sendChatBtn');

        // Carregar vídeo localmente ou via input
        loadVideoBtn.addEventListener('click', () => {
            const url = videoUrlInput.value.trim();
            if (url) {
                videoPlayer.src = url;
                socket.emit('change-video', url);
            }
        });

        // Enviar mensagem de chat
        function sendMessage() {
            const text = chatInput.value.trim();
            if (text) {
                socket.emit('chat-message', text);
                chatInput.value = '';
            }
        }

        sendChatBtn.addEventListener('click', sendMessage);
        chatInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        // Receber mensagens do chat do servidor
        socket.on('chat-message', (data) => {
            const div = document.createElement('div');
            div.classList.add('message');
            div.innerHTML = `<b>${data.user || 'Anónimo'}:</b> ${data.text}`;
            chatMessages.appendChild(div);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        });

        // Sincronizar vídeo remotamente
        socket.on('change-video', (url) => {
            if (videoPlayer.src !== url) {
                videoPlayer.src = url;
            }
        });

        videoPlayer.addEventListener('play', () => {
            socket.emit('video-action', { action: 'play', time: videoPlayer.currentTime });
        });

        videoPlayer.addEventListener('pause', () => {
            socket.emit('video-action', { action: 'pause', time: videoPlayer.currentTime });
        });

        socket.on('video-action', (data) => {
            if (Math.abs(videoPlayer.currentTime - data.time) > 1.5) {
                videoPlayer.currentTime = data.time;
            }
            if (data.action === 'play') {
                videoPlayer.play().catch(() => {});
            } else {
                videoPlayer.pause();
            }
        });
    </script>
</body>
</html>
